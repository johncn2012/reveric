# MetaArc (元弧) 生产环境 Nginx 核心配置
# 适配域名: MetaArc.COM.CN 与 api.MetaArc.COM.CN

# 1. HTTP 流量全局 301 强制跳转至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name metaarc.com.cn www.metaarc.com.cn api.metaarc.com.cn;

    # Let's Encrypt ACME 证书校验入口
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. MetaArc 主门户与运营 Web 客户端 (https://metaarc.com.cn)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metaarc.com.cn www.metaarc.com.cn;

    # SSL 证书配置 (由 certbot 自动生成并挂载)
    ssl_certificate /etc/letsencrypt/live/metaarc.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metaarc.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1440m;

    # 客户端上传与媒体文件上限
    client_max_body_size 500M;

    # Gzip 极速压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 静态资产长缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 主站反向代理到 Node/Docker BaaS 服务
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 真实客户端 IP 传递
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# 3. MetaArc 商业中台 API 网关 (https://api.metaarc.com.cn)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.metaarc.com.cn;

    ssl_certificate /etc/letsencrypt/live/metaarc.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metaarc.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式传输 (SSE / AI 生成 Stream 支持)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
