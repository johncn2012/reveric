output: dist/
# 产物文件名用 MetaArc，不跟随 pubspec 的包名。Windows 安装器为
# MetaArc-<version>-windows-setup.exe，与更新清单里的 file 名一致。
artifact_name: 'MetaArc-{{build_name}}{{#is_profile}}-{{build_mode}}{{/is_profile}}-{{platform}}{{#channel}}-{{channel}}{{/channel}}{{#is_installer}}-setup{{/is_installer}}.{{ext}}'
releases:
  - name: release
    jobs:
      - name: macos-dmg
        package:
          platform: macos
          channel: arm64
          hooks:
            pre: 'python3 macos/architectures.py "$BUILD_OUTPUT_DIRECTORY/MetaArc.app"'
          target: dmg
          build_args:
            release: true
      - name: macos-zip
        package:
          platform: macos
          channel: arm64
          hooks:
            pre: 'python3 macos/architectures.py "$BUILD_OUTPUT_DIRECTORY/MetaArc.app"'
          target: zip
          build_args:
            release: true
      - name: windows-exe
        package:
          platform: windows
          target: exe
          build_args:
            release: true
      - name: windows-zip
        package:
          platform: windows
          target: zip
          build_args:
            release: true
      - name: linux-zip
        package:
          platform: linux
          target: zip
          build_args:
            release: true
