upstream metaarc_local {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 3000 ssl http2;
    server_name metaarc.com.cn www.metaarc.com.cn api.metaarc.com.cn _;

    ssl_certificate /etc/nginx/ssl/metaarc/server.crt;
    ssl_certificate_key /etc/nginx/ssl/metaarc/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:metaarc_tls:8m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 500m;

    # 信任的入口反代 IP
    set_real_ip_from 40.82.136.74;
    set_real_ip_from 20.196.65.232;
    set_real_ip_from 124.129.39.130;
    set_real_ip_from 13.13.60.1;
    set_real_ip_from 13.13.60.254;
    real_ip_header X-Real-IP;

    location / {
        proxy_pass http://metaarc_local;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
