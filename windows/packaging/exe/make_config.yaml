# Install identity stays ai.reveric so an upgrade replaces the existing setup.
# Changing AppId would leave the old installation beside the new one.
# The executable inside the setup is MetaArc.exe.
app_id: ai.reveric
publisher: MetaArc
publisher_url: "https://MetaArc.COM.CN"
display_name: MetaArc
create_desktop_icon: true
setup_icon_file: windows\runner\resources\app_icon.ico
locales:
  - en
  - zh
script_template: inno_setup.iss
